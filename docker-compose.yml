services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-change-me}"

  latentsearch:
    build: .
    container_name: latentsearch
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    environment:
      DJANGO_SETTINGS_MODULE: latent_search.server.config.settings
      SECRET_KEY: ${SECRET_KEY:?Set a SECRET_KEY in your .env file}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      QDRANT_URL: "${QDRANT_URL:?Set QDRANT_URL in your .env file}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      HF_HOME: /cache/huggingface
      PYTORCH_DISABLE_AVX512_BF16_MATMUL: "1"
      LS_USERNAME: "${LS_USERNAME:-}"
      LS_PASSWORD: "${LS_PASSWORD:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - /mnt/user/nextcloud:/nc_data:r
      - hf_cache:/cache/huggingface
      - ./media:/app/media
    tmpfs:
      - /tmp:noexec,nosuid,size=512m

  watcher:
    build: .
    container_name: latentsearch-watcher
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      DJANGO_SETTINGS_MODULE: latent_search.server.config.settings
      SECRET_KEY: ${SECRET_KEY:?Set a SECRET_KEY in your .env file}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      QDRANT_URL: "${QDRANT_URL:?Set QDRANT_URL in your .env file}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      HF_HOME: /cache/huggingface
      PYTORCH_DISABLE_AVX512_BF16_MATMUL: "1"
      MEDIA_WATCH_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - /mnt/user/nextcloud:/nc_data:r
      - hf_cache:/cache/huggingface
    # Entry point for watcher service
    command: ["python", "manage.py", "watch_media"]

volumes:
  hf_cache:
