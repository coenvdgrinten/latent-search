services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-change-me}"

  latentsearch:
    build: .
    container_name: latentsearch
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    environment:
      DJANGO_SETTINGS_MODULE: latent_search.server.config.settings
      SECRET_KEY: ${SECRET_KEY:?Set a SECRET_KEY in your .env file}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      QDRANT_URL: "${QDRANT_URL:?Set QDRANT_URL in your .env file}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      HF_HOME: /cache/huggingface
      PYTORCH_DISABLE_AVX512_BF16_MATMUL: "1"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      LS_USERNAME: "${LS_USERNAME:-}"
      LS_PASSWORD: "${LS_PASSWORD:-}"
      NVIDIA_VISIBLE_DEVICES: all
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
      # VLM (caption enrichment only, not used during search) runs on CPU so it
      # does not compete for VRAM with CLIP+BGE+SPLADE in the two containers.
      # Set LS_VLM_DEVICE=cuda only if running a single container or have VRAM headroom.
      LS_VLM_DEVICE: "${LS_VLM_DEVICE:-cpu}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - /mnt/user/nextcloud:/nc_data:r
      - hf_cache:/cache/huggingface
      - ./media:/app/media
    tmpfs:
      - /tmp:noexec,nosuid,size=512m


    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  watcher:
    build: .
    container_name: latentsearch-watcher
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      DJANGO_SETTINGS_MODULE: latent_search.server.config.settings
      SECRET_KEY: ${SECRET_KEY:?Set a SECRET_KEY in your .env file}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      QDRANT_URL: "${QDRANT_URL:?Set QDRANT_URL in your .env file}"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      HF_HOME: /cache/huggingface
      PYTORCH_DISABLE_AVX512_BF16_MATMUL: "1"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      MEDIA_WATCH_ENABLED: "true"
      NVIDIA_VISIBLE_DEVICES: all
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - /mnt/user/nextcloud:/nc_data:r
      - hf_cache:/cache/huggingface
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Entry point for watcher service
    command: ["python", "manage.py", "watch_media"]

volumes:
  hf_cache:
